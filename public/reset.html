<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Nouveau mot de passe · Budget</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#101828;--mu:#667085;--ac:#2547d0;--bad:#c2331f;--ok:#0e7c5a;--bd:#e0e4ea;--in:#f7f8fa;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--tx:#eef1f5;--mu:#98a2b3;--ac:#7f9bff;--bad:#ff8a78;--ok:#4cc79c;--bd:#2a3441;--in:#111820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--tx:#eef1f5;--mu:#98a2b3;--ac:#7f9bff;--bad:#ff8a78;--ok:#4cc79c;--bd:#2a3441;--in:#111820;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--mu);margin:0 0 16px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:12px}
input{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
#msg{font-size:14px;min-height:20px;margin:0 0 8px;color:var(--bad)}#msg.ok{color:var(--ok)}a{color:var(--ac)}
[hidden]{display:none!important}
/* Helios */
:root{--bg:#efe6ee;--card:#ffffff;--tx:#241a23;--mu:#7d6f7c;--ac:#9a5a95;--bd:rgba(70,35,68,.13);--in:#f6eff5;--grad:linear-gradient(120deg,color-mix(in srgb,var(--ac) 40%,#000),color-mix(in srgb,var(--ac) 84%,#000))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0a0e;--card:#181319;--tx:#f5eef4;--mu:#a99ca8;--ac:#cf9fca;--bd:rgba(255,255,255,.09);--in:rgba(255,255,255,.05)}}
body{font-family:"Outfit","Urbanist","Avenir Next","Segoe UI",system-ui,sans-serif;background-image:radial-gradient(800px 480px at 15% -10%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 65%),radial-gradient(700px 420px at 100% 110%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 65%);background-attachment:fixed}
main{border-radius:26px;background:linear-gradient(155deg,color-mix(in srgb,var(--card),#fff 8%),var(--card) 72%);box-shadow:0 30px 80px rgba(0,0,0,.25);padding:26px}
h1{font-weight:500;letter-spacing:-.02em}
input{border-radius:12px}
button.p,button#go,button{border-radius:999px;background:var(--grad);color:#fff;font-weight:500}
button.l{background:none;color:var(--ac)}
.pw{position:relative;display:block}
.pw input{padding-right:46px!important}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:var(--mu);display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:none}
.pw .eye:hover{color:var(--tx)}
.pw .eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body><main>
<h1>Nouveau mot de passe</h1>
<section id="f"><p>Choisis un mot de passe d’au moins 8 caractères.</p>
<label>Nouveau mot de passe<span class="pw"><input id="a" type="password" autocomplete="new-password" autofocus><button type="button" class="eye" aria-label="Afficher le mot de passe" title="Afficher le mot de passe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
<label>Confirmation<span class="pw"><input id="b" type="password" autocomplete="new-password"><button type="button" class="eye" aria-label="Afficher le mot de passe" title="Afficher le mot de passe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
<div id="msg"></div>
<button id="go">Enregistrer</button></section>
<section id="d" hidden><p>Mot de passe modifié. <a href="login.html">Se connecter</a></p></section>
</main>
<script>
const $=s=>document.getElementById(s),tok=location.hash.slice(1);
history.replaceState(null,'',location.pathname);
async function go(){
  const m=$('msg');m.className='';m.textContent='';
  if(!tok){m.textContent='Lien invalide. Refais une demande depuis la page de connexion.';return}
  if($('a').value.length<8){m.textContent='8 caractères minimum.';return}
  if($('a').value!==$('b').value){m.textContent='Les deux saisies sont différentes.';return}
  try{
    const r=await fetch('api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,password:$('a').value})});
    const j=await r.json();
    if(r.ok){$('f').hidden=true;$('d').hidden=false;return}
    m.textContent=j.error||'Échec.';
  }catch(e){m.textContent='Serveur injoignable.'}
}
$('go').onclick=go;
document.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
const ON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
document.querySelectorAll('.eye').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>{const i=b.parentNode.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?OFF:ON;const l=show?'Masquer le mot de passe':'Afficher le mot de passe';b.setAttribute('aria-label',l);b.setAttribute('title',l);i.focus()})});
</script></body></html>
