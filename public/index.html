<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon budget</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#101828;--mu:#667085;--ac:#2547d0;--ok:#0e7c5a;--bad:#c2331f;--bd:#e0e4ea;--in:#f7f8fa;--act:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--tx:#eef1f5;--mu:#98a2b3;--ac:#7f9bff;--ok:#4cc79c;--bad:#ff8a78;--bd:#2a3441;--in:#111820;--act:#0f141b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--tx:#eef1f5;--mu:#98a2b3;--ac:#7f9bff;--ok:#4cc79c;--bad:#ff8a78;--bd:#2a3441;--in:#111820;--act:#0f141b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.k small{display:block;color:var(--mu);font-size:13px}
.k b{font-size:20px}
.k input{width:100%;border:0;background:transparent;color:var(--tx);font:inherit;font-size:20px;font-weight:700;padding:0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button{flex:1 1 28%;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:var(--act)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.box h2{font-size:16px;margin:0 0 8px}
.r{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.r input{min-width:0;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
.r input:not([type=number]):not([type=month]){flex:1}
.g{cursor:grab;touch-action:none;user-select:none;color:var(--mu);padding:0 6px 0 0;font-size:18px;line-height:1}
.r.over{outline:2px solid var(--ac);border-radius:8px}.r.drag{opacity:.5}
.r input[type=number]{width:92px;text-align:right}
.r{flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.fg label{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.fg input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
.sub{flex-basis:100%;display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:13px;padding-left:24px}
.sub label{display:flex;align-items:center;gap:6px}
.sub input{width:64px!important;padding:6px!important}
.sub input[type=month]{width:150px!important}
.r button,.add{border:0;background:transparent;color:var(--mu);font:inherit}
.r button{font-size:20px;padding:0 6px}
.add{color:var(--ac);font-weight:600;padding:6px 0}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:8px;margin-top:6px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--bd);margin:0 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}.bar i.over{background:var(--bad)}
.hd{display:flex;justify-content:flex-end;gap:6px;color:var(--mu);font-size:13px;margin-bottom:4px}
.hd span{width:92px;text-align:right}.hd span+span{margin-right:30px}
.note{color:var(--mu);font-size:13px;margin:0 0 8px}
.rst{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;text-decoration:underline;margin:6px 0 20px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--act);font:inherit;font-weight:600}
.btn.g{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:var(--bad);color:#fff}
.u{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;max-width:90%;padding:10px 14px;border-radius:10px;color:#fff;font-size:14px;display:none}
#toast.ok{background:var(--ok)}#toast.bad{background:var(--bad)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
.ic{display:flex;gap:8px}
.icb{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:inline-grid;place-items:center;padding:0;cursor:pointer}
.icb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icb.on{background:var(--ac);border-color:var(--ac);color:var(--act)}
.sub input[type=checkbox]{width:18px!important;height:18px;padding:0!important;margin:0;flex:none!important}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:3}
#fx span{position:absolute;font-size:var(--s,20px);opacity:.55;animation-duration:var(--d,12s);animation-delay:var(--w,0s);animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform;user-select:none}
#fx .fall{top:0;left:var(--x);animation-name:fall}
#fx .rise{bottom:0;left:var(--x);animation-name:rise}
#fx .fly{left:0;top:var(--t);animation-name:fly}
@keyframes fall{from{transform:translate3d(0,-12vh,0) rotate(0)}to{transform:translate3d(var(--dx,0),112vh,0) rotate(300deg)}}
@keyframes rise{0%{transform:translate3d(0,12vh,0) scale(.8);opacity:0}15%{opacity:.8}100%{transform:translate3d(var(--dx,0),-112vh,0) scale(1.1);opacity:0}}
@keyframes fly{0%{transform:translate3d(-12vw,0,0)}50%{transform:translate3d(50vw,var(--dy,0),0)}100%{transform:translate3d(112vw,0,0)}}
#view.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar i{transform-origin:left;animation:grow .6s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.btn,.icb,.tabs button{transition:transform .12s,background .2s,color .2s,border-color .2s}
.btn:active,.icb:active,.tabs button:active{transform:scale(.96)}
#gear svg{transition:transform .5s}#gear:hover svg,#gear.on svg{transform:rotate(90deg)}
#toast{animation:toast .25s ease-out}
@keyframes toast{from{opacity:0;margin-bottom:-10px}to{opacity:1;margin-bottom:0}}
.noanim *,.noanim *::before{animation:none!important;transition:none!important}
.sub input[type=date]{width:150px!important}
</style></head><body><main>
<h1>Mon budget mensuel <small id="evt" style="font-size:14px;font-weight:600;color:var(--ac)"></small></h1>
<div class="top"><span id="who"></span><span class="ic"><button type="button" class="icb" id="gear" title="Paramètres" aria-label="Paramètres"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button type="button" class="icb" id="out" title="Se déconnecter" aria-label="Se déconnecter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></span></div>
<p class="note" id="st" style="margin:0 0 10px"></p>
<div class="sum" id="sum"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<button class="rst" id="exp">Exporter une sauvegarde</button> <button class="rst" id="rst">Réinitialiser les données</button>
</main>
<div id="fx" aria-hidden="true"></div>
<div id="toast"></div>
<script>
const K='budget-v1';
const DEF=()=>({revenus:[["Salaire",1825,"",2]],start:0,goals:[],credits:[{n:"Hyundai",cap:0,rate:0,dur:0,start:"",ins:0,pay:334.33,ex:0}],
fixes:[["Compte joint",810,"",2],["Essence",220,"",2],["Hyundai (crédit)",334.33,"",6],["Assurance auto",59.16,"",5],["Téléphone",12.99,"",5],["Abonnements",30,"",18],["Impôt",142,"2026-12",25]],
vars:[["Courses",300,0],["Restos / fast-food",40,0],["Shopping / loisirs",70,0]],
ca:[["Steven",810],["Marie",0]],cd:[]});
let S=DEF(),me=null,ready=false;
const DAYS={"Compte joint":2,"Essence":2,"Hyundai (crédit)":6,"Assurance auto":5,"Téléphone":5,"Abonnements":18,"Impôt":25};
const mig=()=>{let c=false;S.fixes.forEach(x=>{if(x[2]===undefined){x[2]='';c=true}if(x[3]===undefined){x[3]=DAYS[x[0]]||'';c=true}});
  if(!S.revenus){S.revenus=[["Salaire",+S.income||0,"",S.incomeDay||2]];c=true}
  S.revenus.forEach(x=>{if(x[2]===undefined){x[2]='';c=true}if(x[3]===undefined){x[3]='';c=true}});
  if(!Array.isArray(S.cd)){S.cd=[];c=true}
  S.cd.forEach(x=>{if(x[2]===undefined){x[2]=0;c=true}});
  if(!S.divers){S.divers=[];c=true}
  if(!S.vars.some(x=>/^divers/i.test(x[0]))){S.vars.push(["Divers",0,0]);c=true}
  if(!S.credits){S.credits=[{n:"Hyundai",cap:0,rate:0,dur:0,start:"",ins:0,pay:334.33,ex:0}];c=true}
  if(!S.goals){S.goals=[];c=true}return c};
mig();
let rev=0;
let addFix=null;
const ymKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const actv=(a,key)=>a.filter(x=>!x[2]||key<=x[2]);
const BLANK=sh=>({revenus:[],start:0,goals:[],credits:[],fixes:[],vars:[["Courses",0,0],["Restos / fast-food",0,0],["Shopping / loisirs",0,0]],ca:(sh&&sh.ca)||[],cd:(sh&&sh.cd)||[]});
const st=t=>{const el=document.getElementById('st');if(el)el.textContent=t};
const save=()=>{
  fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)})
    .then(r=>{if(r.status===401){location.href='login.html';throw 0}if(!r.ok)throw 0;return r.json()}).then(j=>{rev=j.rev;st('Synchronisé')})
    .catch(()=>st('Hors ligne : la dernière modification n’est peut-être pas enregistrée'))};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const f=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const sum=(a,i=1)=>a.reduce((t,x)=>t+(+x[i]||0),0);
const cl=n=>n>=0?'pos':'neg';
let tab='fixes';
const TABS=[['fixes','Fixes'],['prev','Prévisionnel'],['com','Commun'],['proj','Projection'],['cre','Crédit'],['epa','Épargne']];

const showEnd=new Set();
const row=(k,i)=>`<div class="r" data-row="${k}.${i}"><span class="g" data-g aria-label="Déplacer">⠿</span><input data-p="${k}.${i}.0" value="${esc(S[k][i][0])}" placeholder="Libellé"><input type="number" step="0.01" inputmode="decimal" data-n data-p="${k}.${i}.1" value="${S[k][i][1]}"><button data-del="${k}.${i}" aria-label="Supprimer">×</button>${(k=='fixes'||k=='revenus')?`<div class="sub"><label>Le <input type="number" min="1" max="31" inputmode="numeric" data-n data-p="${k}.${i}.3" value="${S[k][i][3]||''}" aria-label="Jour du mois"> du mois</label><label><input type="checkbox" data-endchk="${k}.${i}" ${(S[k][i][2]||showEnd.has(k+'.'+i))?'checked':''}> Date de fin</label>${(S[k][i][2]||showEnd.has(k+'.'+i))?`<input type="month" data-p="${k}.${i}.2" value="${S[k][i][2]||''}" aria-label="Date de fin">`:''}</div>`:''}${k=='divers'?`<div class="sub"><label>Date <input type="date" data-p="divers.${i}.2" value="${S[k][i][2]||''}"></label></div>`:''}</div>`;
const newFix=k=>addFix===k?`<div style="border-top:1px solid var(--bd);margin-top:8px;padding-top:8px"><p class="note" style="margin:0 0 6px">${k=='revenus'?'Nouveau revenu':'Nouvelle charge fixe'}</p><div class="fg"><label>Libellé<input id="nfn" placeholder="${k=='revenus'?'Ex. Allocation CAF':'Ex. Assurance habitation'}"></label><label>Montant (€)<input id="nfa" type="number" step="0.01" inputmode="decimal"></label><label>Jour du mois<input id="nfd" type="number" min="1" max="31" inputmode="numeric" placeholder="1 à 31"></label><label style="flex-direction:row;align-items:center;gap:8px"><input id="nfc" type="checkbox" style="width:18px;height:18px;margin:0;padding:0;flex:none"> Date de fin</label><label id="nfew" style="display:none">Mois de fin<input id="nfe" type="month"></label></div><div class="u"><button class="btn" data-a="fixok">Ajouter</button><button class="btn g" data-a="fixno">Annuler</button></div></div>`:`<button class="add" data-a="fixnew" data-v="${k}">+ Ajouter ${k=='revenus'?'un revenu':'une ligne'}</button>`;
const list=(k,title,note)=>`<div class="box"><h2>${title}</h2>${note?`<p class="note">${note}</p>`:''}${S[k].map((_,i)=>row(k,i)).join('')}${(k=='fixes'||k=='revenus')?newFix(k):`<button class="add" data-add="${k}">+ Ajouter une ligne</button>`}<div class="tot"><span>Total</span><span>${f(sum(S[k]))}</span></div></div>`;

const cal=()=>{
  const key=ymKey(new Date()),ev=[],fa=actv(S.fixes,key),ra=actv(S.revenus,key);
  ra.forEach(x=>{if(+x[3]&&(+x[1]||0))ev.push([+x[3],x[0]||'—',+x[1]||0])});
  fa.forEach(x=>{if(+x[3]&&(+x[1]||0))ev.push([+x[3],x[0]||'—',-(+x[1]||0)])});
  ev.sort((a,b)=>a[0]-b[0]||b[2]-a[2]);
  const nod=fa.concat(ra).filter(x=>!+x[3]&&(+x[1]||0)).length;let bal=+S.start||0;
  let h=`<div class="box"><h2>Calendrier du mois</h2><p class="note">Solde après chaque mouvement fixe. Les dépenses variables ne sont pas incluses.</p>
  <div class="r" style="margin:0 0 10px"><span style="flex:1">Solde au 1er du mois</span><input type="number" step="0.01" inputmode="decimal" data-n data-p="start" value="${S.start||0}"></div>`;
  ev.forEach(e=>{bal+=e[2];h+=`<div class="tot" style="border:0;margin:0 0 6px;padding:0;font-weight:400"><span>${e[0]} · ${esc(e[1])}</span><span><span class="${e[2]<0?'neg':'pos'}">${f(e[2])}</span> <small style="color:var(--mu)">→ <span class="${cl(bal)}">${f(bal)}</span></small></span></div>`});
  if(nod)h+=`<p class="note">${nod} ligne(s) sans jour ne figurent pas dans le calendrier.</p>`;
  return h+'</div>'};
const fld=(l,p,v,n,st)=>`<label>${l}<input ${n?'type="number" step="'+(st||'0.01')+'" inputmode="decimal" data-n ':'type="month" '}data-p="${p}" value="${v}"></label>`;
const sim=(bal,p,r,max)=>{let k=0,it=0;while(bal>0.005&&k<max){const i=bal*r;if(p<=i+1e-9)return{k:max,it:0};it+=i;bal-=Math.min(bal,p-i);k++}return{k,it}};
const dt=(y,m)=>new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
const crd=()=>{let h='';
  S.credits.forEach((x,i)=>{
    const cap=+x.cap||0,n=Math.round(+x.dur||0),r=(+x.rate||0)/1200,ins=+x.ins||0,ex=+x.ex||0;
    const cp=cap&&n?(r?cap*r/(1-Math.pow(1+r,-n)):cap/n):0,p=+x.pay>0?+x.pay:cp;
    let out='<p class="note">Renseigne le capital, la durée et le taux pour voir le détail.</p>';
    if(cap&&n&&p){
      const sp=(x.start||'').split('-').map(Number),sy=sp[0],sm=sp[1],now=new Date();
      const e=sy?Math.max(0,Math.min(n,(now.getFullYear()-sy)*12+now.getMonth()+1-sm)):0;
      let bal=cap,tot=0,paid=0,bn=cap;
      for(let k=1;k<=n&&bal>0.005;k++){const it=bal*r;bal-=Math.min(bal,p-it);tot+=it;if(k<=e){paid+=it;bn=bal}}
      const left=tot-paid,rem=n-e,L=(a,b)=>`<div class="tot" style="border:0;margin:0 0 4px;padding:0;font-weight:400"><span>${a}</span><span>${b}</span></div>`;
      out=`<div class="bar"><i style="width:${Math.min(100,e/n*100)}%"></i></div>`+
        L('Mensualité'+(ins?' (assurance incluse)':''),f(p+ins))+
        (+x.pay>0&&cp&&Math.abs(cp-p)>0.5?L('Mensualité calculée (sans assurance)',f(cp)):'')+
        L('Intérêts sur la durée',f(tot))+L('Coût des intérêts + assurance',f(tot+ins*n))+
        L('Échéances payées / restantes',e+' / '+rem)+L('Total déjà versé',f(e*(p+ins)))+L('dont capital remboursé',f(cap-bn))+L('dont intérêts + assurance',f(paid+e*ins))+L('Capital restant dû (estimé)',f(bn))+L('Intérêts restants',f(left))+L('Reste à payer (mensualités)',f(rem*(p+ins)))+
        (sy?L('Dernière échéance',dt(sy,sm+n-2)):'');
      if(ex>0&&rem>0){const s2=sim(Math.max(0,bn-ex),p,r,600);
        out+=`<p class="note" style="margin:8px 0 0">Remboursement anticipé de ${f(ex)} : ${s2.k>=600?'mensualité trop faible pour solder le reste':'tu économises '+f(Math.max(0,left-s2.it))+' d’intérêts et '+Math.max(0,rem-s2.k)+' mois'}.</p>`}
    }
    h+=`<div class="box"><div class="r"><input data-p="credits.${i}.n" value="${esc(x.n)}" placeholder="Nom du crédit"><button data-del="credits.${i}" aria-label="Supprimer">×</button></div><div class="fg">`+
      fld('Capital emprunté (€)',`credits.${i}.cap`,x.cap,1)+fld('Taux annuel (%)',`credits.${i}.rate`,x.rate,1,'0.001')+
      fld('Durée (mois)',`credits.${i}.dur`,x.dur,1,'1')+fld('1re mensualité',`credits.${i}.start`,x.start||'',0)+
      fld('Assurance (€/mois)',`credits.${i}.ins`,x.ins,1)+fld('Mensualité imposée (0 = calculée)',`credits.${i}.pay`,x.pay,1)+
      fld('Remboursement anticipé (€)',`credits.${i}.ex`,x.ex,1)+`</div>`+out+`</div>`});
  return h+'<button class="add" data-add="credits">+ Ajouter un crédit</button><p class="note">Estimations indicatives : ton tableau d’amortissement fait foi.</p>'};
const gl=()=>{let h='<div class="box"><h2>Objectifs d’épargne</h2><p class="note">Un objectif, ce que tu as déjà et ce que tu mets de côté chaque mois.</p>',tm=0;
  S.goals.forEach((g,i)=>{const t=+g.target||0,s=+g.saved||0,m=+g.month||0,left=Math.max(0,t-s);tm+=m;
    const mo=left===0?0:(m>0?Math.ceil(left/m):null),d=new Date();
    const end=mo?dt(d.getFullYear(),d.getMonth()+mo):'';
    h+=`<div style="border-top:1px solid var(--bd);padding-top:8px;margin-top:8px"><div class="r"><input data-p="goals.${i}.n" value="${esc(g.n)}" placeholder="Objectif"><button data-del="goals.${i}" aria-label="Supprimer">×</button></div><div class="fg">`+
      fld('Objectif (€)',`goals.${i}.target`,g.target,1)+fld('Déjà épargné (€)',`goals.${i}.saved`,g.saved,1)+fld('Mis de côté / mois (€)',`goals.${i}.month`,g.month,1)+
      `</div><div class="bar"><i style="width:${t?Math.min(100,s/t*100):0}%"></i></div><p class="note" style="margin:0">${t&&!left?'Objectif atteint.':(mo===null?'Indique un montant mensuel pour estimer la date.':'Reste '+f(left)+' · '+mo+' mois · vers '+end)}</p></div>`});

  h+=box('Apparence',`<p class="note">Thème</p><div class="tabs" style="margin-bottom:12px">${[['auto','Auto'],['light','Clair'],['dark','Sombre']].map(t=>`<button data-a="theme" data-v="${t[0]}" class="${(u.theme||'auto')==t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
    <p class="note">Couleur principale</p><div class="u">${SW.map(c=>`<button data-a="accent" data-v="${c}" aria-label="Couleur ${c}" style="width:34px;height:34px;border-radius:50%;border:3px solid ${u.accent===c?'var(--tx)':'transparent'};background:${c}"></button>`).join('')}<button class="btn g" data-a="accent" data-v="" ${mini}>Par défaut</button></div><p class="note" style="margin-top:14px">Thèmes événementiels</p><div class="tabs" style="margin-bottom:6px">${[['auto','Auto'],['off','Désactivé']].concat(SEAS.map(x=>[x.id,x.e+' '+x.n])).map(t=>`<button data-a="season" data-v="${t[0]}" class="${(u.season||'auto')==t[0]?'on':''}">${t[1]}</button>`).join('')}</div><p class="note" style="margin:0">« Auto » applique le thème de la fête en cours. Un thème événementiel remplace la couleur choisie ci-dessus.</p><label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px"><input type="checkbox" id="animchk" ${animOn?'checked':''} style="width:18px;height:18px;margin:0"> Animations (effets de fête et transitions)</label>`);
  h+=box('Sécurité',`<div class="fg">${inp('cp','Mot de passe actuel','','password','autocomplete="current-password"')}${inp('np','Nouveau mot de passe (8 min.)','','password','autocomplete="new-password"')}</div><button class="btn" data-a="savepw">Changer le mot de passe</button>`);
  h+=box('Données',`<p class="note">Sauvegarde ou restaure tes données personnelles. Le compte commun n’est pas touché par l’import.</p><div class="u"><button class="btn g" data-a="export">Exporter</button><button class="btn g" data-a="import">Importer un fichier…</button><input type="file" id="imp" accept="application/json,.json" hidden></div>`);
  if(adm){
    h+=box('Administration',`<p class="note">Ton mot de passe est demandé pour ajouter ou supprimer un profil, envoyer un lien ou modifier l’e-mail du serveur.</p><div class="fg">${inp('ac','Ton mot de passe','','password','autocomplete="current-password"')}</div>`);
    h+=box('Utilisateurs',cfg.users.map(x=>`<div class="u"><span>${av(x,34)}</span><span style="flex:1;min-width:120px"><b>${esc(x.name)}</b>${x.admin?' · admin':''}<br><small style="color:var(--mu)">${esc(x.id)}${x.email?' · '+esc(x.email):' · pas d’e-mail'}</small></span>${x.id===u.id?'':`<button class="btn g" data-a="resetlink" data-v="${esc(x.id)}" ${mini}>Lien mot de passe</button><button class="btn d" data-a="deluser" data-v="${esc(x.id)}" ${mini}>Supprimer</button>`}</div>`).join('')+
      `<p class="note" style="margin-top:14px">Ajouter un utilisateur</p><div class="fg">${inp('ni','Identifiant (minuscules)','','text','autocapitalize="none" autocomplete="off"')}${inp('nn','Nom affiché','')}${inp('ne','E-mail (facultatif)','','email','autocomplete="off"')}${inp('nw','Mot de passe (8 min.)','','password','autocomplete="new-password"')}</div><button class="btn" data-a="adduser">Ajouter</button>`);
    h+=box('E-mail (mot de passe oublié)',`<p class="note">Sert à envoyer les liens de réinitialisation.${m.fromEnv?' Les valeurs affichées viennent pour l’instant du fichier de configuration du serveur.':''}</p>
      <div class="fg">${inp('sh','Serveur SMTP',m.host)}${inp('sp','Port',m.port,'number','inputmode="numeric"')}${inp('su','Identifiant SMTP',m.user,'text','autocomplete="off"')}${inp('sw','Mot de passe SMTP','','password','autocomplete="new-password" placeholder="'+(m.hasPass?'enregistré (vide = inchangé)':'')+'"')}${inp('sf','Expéditeur',m.from,'text','placeholder="Budget &lt;budget@exemple.fr&gt;"')}${inp('sb','Adresse publique de l’appli',m.base,'url','placeholder="https://budget.exemple.fr"')}</div>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--mu)"><input id="ss" type="checkbox" ${m.secure?'checked':''} style="width:auto;margin:0"> TLS direct (port 465). Sinon STARTTLS (port 587).</label>
      <div class="u"><button class="btn" data-a="savesmtp">Enregistrer</button><button class="btn g" data-a="testsmtp">Envoyer un e-mail de test</button></div>`);
  }
  return h};
async function openSettings(){tab='set';render();
  try{const r=await fetch('api/settings');if(r.status===401){location.href='login.html';return}cfg=await r.json()}
  catch(e){$('#view').innerHTML='<p class="note">Impossible de charger les paramètres.</p>';return}
  $('#view').innerHTML=setHTML()}
async function act(a,v){
  if(a==='fixnew'){addFix=v;render();setTimeout(()=>{const e=document.getElementById('nfn');if(e)e.focus()},0);return}
  if(a==='fixno'){addFix=null;render();return}
  if(a==='fixok'){const n=val('nfn').trim(),m=parseFloat(val('nfa'))||0,d=parseInt(val('nfd'),10)||'',e=document.getElementById('nfc').checked?val('nfe'):'';
    if(!n&&!m)return toast('Indique au moins un libellé ou un montant.');
    if(d!==''&&(d<1||d>31))return toast('Le jour doit être entre 1 et 31.');
    S[addFix].push([n,m,e,d]);addFix=null;save();render();return}
  if(a==='photo')return $('#pf').click();
  if(a==='nophoto')return profile({avatar:''});
  if(a==='saveprof')return profile({name:val('pn'),email:val('pe'),password:val('ppw')});
  if(a==='theme'){prefs.theme=v;applyPrefs();return profile({theme:v})}
  if(a==='season'){prefs.season=v;applyPrefs();return profile({season:v})}
  if(a==='accent'){prefs.accent=v;applyPrefs();return profile({accent:v})}
  if(a==='savepw'){const r=await api('POST','api/password',{current:val('cp'),password:val('np')});
    if(r.ok){toast('Mot de passe modifié.',1);openSettings()}else toast(r.j.error||'Échec.');return}
  if(a==='export')return $('#exp').click();
  if(a==='import')return $('#imp').click();
  const ac=val('ac'),done=(r,t)=>{if(r.ok){toast(t,1);openSettings()}else toast(r.j.error||'Échec.')};
  if(a==='adduser')return done(await api('POST','api/admin/user',{id:val('ni'),name:val('nn'),email:val('ne'),password:val('nw'),confirm:ac}),'Utilisateur ajouté.');
  if(a==='deluser'){if(!confirm('Supprimer ce profil et ses données personnelles ? Le compte commun est conservé.'))return;
    return done(await api('POST','api/admin/delete',{id:v,confirm:ac}),'Profil supprimé.')}
  if(a==='resetlink'){const r=await api('POST','api/admin/resetlink',{id:v,confirm:ac});if(!r.ok)return toast(r.j.error||'Échec.');
    const M={sent:'Lien envoyé par e-mail.','no-email':'Ce profil n’a pas d’adresse e-mail.','no-base':'Renseigne d’abord l’adresse publique de l’appli.',limited:'Déjà 3 demandes cette heure pour ce profil.',logged:'SMTP non configuré : lien écrit dans le journal du serveur.'};
    return toast(M[r.j.status]||('Échec : '+r.j.status),r.j.status==='sent')}
  if(a==='savesmtp')return done(await api('POST','api/admin/smtp',{host:val('sh'),port:val('sp'),user:val('su'),pass:val('sw'),from:val('sf'),base:val('sb'),secure:$('#ss').checked,confirm:ac}),'Réglages e-mail enregistrés.');
  if(a==='testsmtp'){toast('Envoi en cours…',1);const r=await api('POST','api/admin/smtp/test',{});
    toast(r.j.ok?'E-mail de test envoyé à ton adresse.':('Échec : '+(r.j.error||'inconnu')),r.j.ok)}
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.v)});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='pf'&&t.files[0]){try{await profile({avatar:await resize(t.files[0])})}catch(x){toast('Image illisible.')}}
  if(t.id==='imp'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j.fixes)||!Array.isArray(j.vars))throw 0;
    if(!confirm('Remplacer tes données actuelles par ce fichier ?'))return;
    const ca=S.ca,cd=S.cd;S=j;S.ca=ca;S.cd=cd;mig();save();toast('Données importées.',1)}catch(x){toast('Fichier non reconnu.')}t.value=''}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.endchk){const key=t.dataset.endchk,[k,i]=key.split('.');
    if(t.checked)showEnd.add(key);else{S[k][+i][2]='';showEnd.delete(key);save()}render()}
  if(t.id==='animchk'){animOn=t.checked;try{localStorage.setItem('budget-anim',animOn?'1':'0')}catch(x){}document.documentElement.classList.toggle('noanim',!animOn);applyPrefs()}
  if(t.id==='nfc'){const w=document.getElementById('nfew');if(w)w.style.display=t.checked?'':'none'}});
$('#gear').onclick=e=>{e.preventDefault();openSettings()};
$('#out').onclick=e=>{e.preventDefault();fetch('api/logout',{method:'POST'}).finally(()=>{location.href='login.html'})};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='budget-sauvegarde.json';a.click()};
$('#rst').onclick=()=>{if(confirm('Remettre tes données par défaut ? (le compte commun est conservé)')){const ca=S.ca,cd=S.cd;S=me&&me.owner?DEF():BLANK(S);S.ca=ca;S.cd=cd;save();render()}};
render();
(async()=>{
  const pull=async()=>{try{
    const r=await fetch('api/state');
    if(r.status===401){location.href='login.html';return}
    if(!r.ok)throw 0;const j=await r.json();
    me=j.me;prefs={theme:me.theme||'auto',accent:me.accent||'',season:me.season||'auto'};applyPrefs();hdr();
    if(!j.state){S=me.owner?DEF():BLANK(j.shared);ready=true;save();render();return}
    if(!ready||j.rev!==rev){rev=j.rev;S=j.state;const was=mig();const first=!ready;ready=true;if(was)save();
      const a=document.activeElement;if(first||(!(a&&a.tagName==='INPUT')&&!addFix))render()}
    st('Synchronisé')
  }catch(e){st('Hors ligne : nouvel essai en cours…')}};
  await pull();setInterval(pull,5000);
})();
</script></body></html>
