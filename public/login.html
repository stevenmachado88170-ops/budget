<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion · Budget</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#101828;--mu:#667085;--ac:#2547d0;--bad:#c2331f;--ok:#0e7c5a;--bd:#e0e4ea;--in:#f7f8fa;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202a;--tx:#eef1f5;--mu:#98a2b3;--ac:#7f9bff;--bad:#ff8a78;--ok:#4cc79c;--bd:#2a3441;--in:#111820;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202a;--tx:#eef1f5;--mu:#98a2b3;--ac:#7f9bff;--bad:#ff8a78;--ok:#4cc79c;--bd:#2a3441;--in:#111820;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--mu);margin:0 0 16px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:12px}
input{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
button.p{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
button.l{background:none;border:0;color:var(--ac);font:inherit;font-size:14px;padding:12px 0 0;width:100%}
#err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 8px}#okm{color:var(--ok);font-size:14px;margin:0 0 8px}
[hidden]{display:none!important}
/* Helios */
:root{--bg:#efe6ee;--card:#ffffff;--tx:#241a23;--mu:#7d6f7c;--ac:#9a5a95;--bd:rgba(70,35,68,.13);--in:#f6eff5;--grad:linear-gradient(120deg,color-mix(in srgb,var(--ac) 40%,#000),color-mix(in srgb,var(--ac) 84%,#000))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0a0e;--card:#181319;--tx:#f5eef4;--mu:#a99ca8;--ac:#cf9fca;--bd:rgba(255,255,255,.09);--in:rgba(255,255,255,.05)}}
body{font-family:"Outfit","Urbanist","Avenir Next","Segoe UI",system-ui,sans-serif;background-image:radial-gradient(800px 480px at 15% -10%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 65%),radial-gradient(700px 420px at 100% 110%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 65%);background-attachment:fixed}
main{border-radius:26px;background:linear-gradient(155deg,color-mix(in srgb,var(--card),#fff 8%),var(--card) 72%);box-shadow:0 30px 80px rgba(0,0,0,.25);padding:26px}
h1{font-weight:500;letter-spacing:-.02em}
input{border-radius:12px}
button.p,button#go,button{border-radius:999px;background:var(--grad);color:#fff;font-weight:500}
button.l{background:none;color:var(--ac)}
</style></head><body><main>
<h1>Mon budget</h1>
<section id="v1"><p>Connecte-toi à ton profil.</p>
<label>Identifiant<input id="id" autocomplete="username" autocapitalize="none" autocorrect="off" autofocus></label>
<label>Mot de passe<input id="pw" type="password" autocomplete="current-password"></label>
<div id="err"></div>
<button class="p" id="go">Se connecter</button>
<button class="l" id="fg">Mot de passe oublié ?</button></section>
<section id="v2" hidden><p>Indique ton identifiant ou ton adresse e-mail : si un profil correspond, tu recevras un lien valable 30 minutes.</p>
<label>Identifiant ou e-mail<input id="q" autocomplete="username" autocapitalize="none" autocorrect="off"></label>
<div id="okm" hidden>Si un profil correspond, un e-mail vient d’être envoyé. Pense à regarder les courriers indésirables.</div>
<button class="p" id="snd">Envoyer le lien</button>
<button class="l" id="bk">Retour à la connexion</button></section>
</main>
<script>
const $=s=>document.getElementById(s);
async function go(){
  $('err').textContent='';
  try{
    const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('id').value.trim(),password:$('pw').value})});
    const j=await r.json();
    if(r.ok){location.href='./';return}
    $('err').textContent=j.error||'Connexion impossible.';
  }catch(e){$('err').textContent='Serveur injoignable.'}
}
$('go').onclick=go;
document.addEventListener('keydown',e=>{if(e.key==='Enter')($('v2').hidden?go:snd)()});
const show=b=>{$('v1').hidden=b;$('v2').hidden=!b};
$('fg').onclick=()=>{$('q').value=$('id').value;show(true)};
$('bk').onclick=()=>show(false);
async function snd(){
  try{await fetch('api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('q').value.trim()})})}catch(e){}
  $('okm').hidden=false;
}
$('snd').onclick=snd;
</script></body></html>
